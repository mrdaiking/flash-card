<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F6F4F0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Felix Cards">
  <title>Felix Cards</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <script>
    // Applied before first paint to avoid a flash of the wrong theme.
    (function () {
      var pref = localStorage.getItem('fc_theme') || 'system';
      var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: 'rgb(var(--color-paper) / <alpha-value>)',
            surface: 'rgb(var(--color-surface) / <alpha-value>)',
            base: 'rgb(var(--color-base) / <alpha-value>)',
            ink: 'rgb(var(--color-ink) / <alpha-value>)',
            muted: 'rgb(var(--color-muted) / <alpha-value>)',
            line: 'rgb(var(--color-line) / <alpha-value>)',
            accent: 'rgb(var(--color-accent) / <alpha-value>)',
            'accent-dark': 'rgb(var(--color-accent-dark) / <alpha-value>)',
            'accent-tint': 'rgb(var(--color-accent-tint) / <alpha-value>)',
            'on-accent': 'rgb(var(--color-on-accent) / <alpha-value>)',
            'rate-again': 'rgb(var(--color-rate-again) / <alpha-value>)',
            'rate-hard': 'rgb(var(--color-rate-hard) / <alpha-value>)',
            'rate-good': 'rgb(var(--color-rate-good) / <alpha-value>)',
            'rate-easy': 'rgb(var(--color-rate-easy) / <alpha-value>)',
          },
          // System font (SF Pro on Apple devices): what the apps next to it use.
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"Segoe UI"', 'system-ui', '"Hiragino Sans"', 'sans-serif'],
            heading: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"Segoe UI"', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    /* Design tokens (redesign 2026-10). Every text/background pair used in the
       app meets WCAG AA 4.5:1. paper = page ground, surface = grouped list /
       card, base = inputs and secondary fills. In dark mode the accent is light,
       so text on it (on-accent) is dark. */
    :root {
      --color-paper: 246 244 240;
      --color-surface: 255 255 255;
      --color-base: 237 232 224;
      --color-ink: 29 27 24;
      --color-muted: 106 100 91;
      --color-line: 227 222 213;
      --color-accent: 166 63 22;
      --color-accent-dark: 126 47 16;
      --color-accent-tint: 251 228 221;
      --color-accent-soft: 240 162 126;
      --color-on-accent: 255 255 255;
      --color-rate-again: 180 35 24;
      --color-rate-hard: 168 83 0;
      --color-rate-good: 47 98 192;
      --color-rate-easy: 29 115 71;
    }
    :root.dark {
      --color-paper: 18 17 16;
      --color-surface: 30 28 26;
      --color-base: 42 39 36;
      --color-ink: 242 238 232;
      --color-muted: 163 156 146;
      --color-line: 52 48 44;
      --color-accent: 232 135 92;
      --color-accent-dark: 240 162 126;
      --color-accent-tint: 58 36 26;
      --color-accent-soft: 110 62 40;
      --color-on-accent: 29 27 24;
      --color-rate-again: 240 122 106;
      --color-rate-hard: 233 162 59;
      --color-rate-good: 127 166 240;
      --color-rate-easy: 91 192 138;
    }
    body {
      background-color: rgb(var(--color-paper));
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
      font-size: 17px; /* iOS body size */
    }
    h1, h2, h3 { letter-spacing: -0.01em; }
    .safe-bottom { padding-bottom: max(env(safe-area-inset-bottom), 0px); }
    .safe-top { padding-top: max(env(safe-area-inset-top), 0px); }
    .prose-content { max-width: 100%; min-width: 0; overflow-wrap: anywhere; }
    /* Tall photos must not blow up the card: cap height, keep aspect ratio. */
    .prose-content img { max-width: 100%; max-height: 45vh; width: auto; height: auto; object-fit: contain; margin: 0 auto; border-radius: 0.5rem; }
    .prose-content table { display: block; max-width: 100%; overflow-x: auto; }
    .prose-content pre { background: rgb(var(--color-base)); padding: 0.75rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.5rem 0; }
    .prose-content code { font-size: 0.85em; background: rgb(var(--color-base)); padding: 0.1em 0.3em; border-radius: 0.25rem; }
    .prose-content pre code { background: transparent; padding: 0; }
    .prose-content p { margin: 0.25rem 0; }
    /* Card text: Japanese needs more leading than Latin/Vietnamese at large sizes
       (lang comes from the deck's read-aloud language, see cardText() in app.js). */
    .card-text:lang(ja) { line-height: 1.7; letter-spacing: 0.02em; }
    /* Per-deck "Serif / Mincho" card font. */
    .card-serif { font-family: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Yu Mincho", YuMincho, "Noto Serif JP", "Noto Serif", ui-serif, Georgia, serif; }

    /* Motion — all gated behind prefers-reduced-motion so it's opt-out, not forced. */
    @media (prefers-reduced-motion: no-preference) {
      @keyframes cardIn {
        from { opacity: 0; transform: translateY(14px) scale(0.98); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      .animate-card-in { animation: cardIn 0.32s cubic-bezier(0.4, 0, 0.2, 1); }

      @keyframes starPop {
        0%   { transform: scale(1); }
        40%  { transform: scale(1.35); }
        100% { transform: scale(1); }
      }
      .animate-star-pop { animation: starPop 0.35s cubic-bezier(0.4, 0, 0.2, 1); }

      /* Bottom sheets (.sheet, toggled by showModal/hideModalEl): slide up + fade. */
      .sheet > div {
        transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.2s;
        transform: translateY(24px);
        opacity: 0;
      }
      .sheet.modal-open > div {
        transform: translateY(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body class="text-ink font-sans min-h-screen select-none">

  <!-- Auth Screen -->
  <div id="auth-screen" class="hidden fixed inset-0 bg-paper flex items-center justify-center z-50 p-4">
    <div class="w-full max-w-sm px-4">
      <div class="text-center mb-8">
        <!-- App mark ("spaced dots"), same drawing as scripts/generate-icons.js -->
        <svg class="mx-auto mb-5" width="72" height="72" viewBox="0 0 1024 1024" aria-hidden="true">
          <rect width="1024" height="1024" rx="228" fill="#B5451A"/>
          <path d="M232 744 C 380 712, 560 600, 792 300" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="18" stroke-linecap="round"/>
          <circle cx="232" cy="744" r="52" fill="#fff"/><circle cx="356" cy="712" r="52" fill="#fff"/>
          <circle cx="528" cy="616" r="52" fill="#fff"/><circle cx="792" cy="300" r="64" fill="#fff"/>
        </svg>
        <h1 class="text-[28px] leading-[34px] font-bold text-ink font-heading">Felix Cards</h1>
        <p class="text-muted mt-1 text-sm">Enter your PIN to continue</p>
      </div>
      <input
        id="pin-input"
        type="password"
        inputmode="numeric"
        placeholder="PIN"
        autocomplete="current-password"
        class="w-full bg-base border border-line rounded-xl px-4 h-12 text-ink text-center text-xl tracking-widest focus:outline-none focus:border-accent mb-4"
      />
      <button
        id="pin-submit"
        class="w-full h-12 bg-accent hover:bg-accent-dark active:bg-accent-dark rounded-xl font-semibold text-on-accent transition-colors"
      >Unlock</button>
      <p id="pin-error" class="text-rate-again text-center mt-3 text-sm hidden">Wrong PIN. Try again.</p>
    </div>
  </div>

  <!-- Network status banner (driven by setNet() in app.js) -->
  <div id="net-banner" role="status" class="hidden fixed top-0 left-0 right-0 z-[60] text-center text-sm font-semibold text-paper px-4 pb-2" style="padding-top: calc(env(safe-area-inset-top) + 0.5rem)"></div>

  <!-- App -->
  <div id="app" class="pb-20 min-h-screen safe-top"></div>

  <!-- Bottom Nav -->
  <nav id="bottom-nav" class="hidden fixed bottom-0 left-0 right-0 bg-paper/95 backdrop-blur border-t border-line safe-bottom z-40">
    <div class="grid grid-cols-3">
      <button onclick="navigate('#/')" class="flex flex-col items-center justify-center h-[49px] gap-0.5 text-muted nav-item" data-route="">
        <svg class="w-[26px] h-[26px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="13" height="15" rx="2.5"/><path d="M8 3h9.5A2.5 2.5 0 0 1 20 5.5V17"/></svg>
        <span class="text-[11px] font-medium">Today</span>
      </button>
      <button onclick="navigate('#/stats')" class="flex flex-col items-center justify-center h-[49px] gap-0.5 text-muted nav-item" data-route="stats">
        <svg class="w-[26px] h-[26px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span class="text-[11px] font-medium">Progress</span>
      </button>
      <button onclick="navigate('#/settings')" class="flex flex-col items-center justify-center h-[49px] gap-0.5 text-muted nav-item" data-route="settings">
        <svg class="w-[26px] h-[26px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        <span class="text-[11px] font-medium">Settings</span>
      </button>
    </div>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/csv.js"></script>
  <script src="/app.js"></script>
</body>
</html>
