<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#C2410C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FlashCards">
  <title>Felix Cards</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    // Applied before first paint to avoid a flash of the wrong theme.
    (function () {
      var pref = localStorage.getItem('fc_theme') || 'system';
      var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: 'rgb(var(--color-paper) / <alpha-value>)',
            surface: 'rgb(var(--color-surface) / <alpha-value>)',
            base: 'rgb(var(--color-base) / <alpha-value>)',
            ink: 'rgb(var(--color-ink) / <alpha-value>)',
            muted: 'rgb(var(--color-muted) / <alpha-value>)',
            line: 'rgb(var(--color-line) / <alpha-value>)',
            accent: 'rgb(var(--color-accent) / <alpha-value>)',
            'accent-dark': 'rgb(var(--color-accent-dark) / <alpha-value>)',
            'accent-tint': 'rgb(var(--color-accent-tint) / <alpha-value>)',
            'on-accent': 'rgb(var(--color-on-accent) / <alpha-value>)',
            'rate-again': 'rgb(var(--color-rate-again) / <alpha-value>)',
            'rate-hard': 'rgb(var(--color-rate-hard) / <alpha-value>)',
            'rate-good': 'rgb(var(--color-rate-good) / <alpha-value>)',
            'rate-easy': 'rgb(var(--color-rate-easy) / <alpha-value>)',
          },
          fontFamily: {
            sans: ['Raleway', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            heading: ['Lora', 'ui-serif', 'serif'],
          },
        }
      }
    }
  </script>
  <style>
    :root {
      --color-paper: 255 251 235;
      --color-surface: 255 255 255;
      --color-base: 242 230 226;
      --color-ink: 61 42 31;
      --color-muted: 138 117 101;
      --color-line: 232 220 201;
      --color-accent: 194 65 12;
      --color-accent-dark: 154 52 18;
      --color-accent-tint: 242 230 226;
      --color-accent-soft: 232 180 154;
      --color-on-accent: 255 255 255;
      --color-rate-again: 220 38 38;
      --color-rate-hard: 217 119 6;
      --color-rate-good: 74 123 124;
      --color-rate-easy: 107 123 60;
    }
    :root.dark {
      --color-paper: 27 20 15;
      --color-surface: 42 32 25;
      --color-base: 20 15 11;
      --color-ink: 242 231 218;
      --color-muted: 168 148 132;
      --color-line: 61 47 36;
      --color-accent: 226 102 46;
      --color-accent-dark: 194 65 12;
      --color-accent-tint: 61 35 19;
      --color-accent-soft: 107 61 35;
      --color-on-accent: 255 255 255;
      --color-rate-again: 239 83 80;
      --color-rate-hard: 245 166 35;
      --color-rate-good: 95 168 174;
      --color-rate-easy: 143 179 94;
    }
    body { background-color: rgb(var(--color-paper)); -webkit-tap-highlight-color: transparent; }
    .card-scene { perspective: 1000px; }
    .card-inner {
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      position: relative;
    }
    .card-inner.flipped { transform: rotateY(180deg); }
    .card-front, .card-back {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .card-back { transform: rotateY(180deg); }
    .safe-bottom { padding-bottom: max(env(safe-area-inset-bottom), 0px); }
    .safe-top { padding-top: max(env(safe-area-inset-top), 0px); }
    .prose-content img { max-width: 100%; border-radius: 0.5rem; }
    .prose-content pre { background: rgb(var(--color-base)); padding: 0.75rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.5rem 0; }
    .prose-content code { font-size: 0.85em; background: rgb(var(--color-base)); padding: 0.1em 0.3em; border-radius: 0.25rem; }
    .prose-content pre code { background: transparent; padding: 0; }
    .prose-content p { margin: 0.25rem 0; }

    /* Motion — all gated behind prefers-reduced-motion so it's opt-out, not forced. */
    @media (prefers-reduced-motion: no-preference) {
      @keyframes cardIn {
        from { opacity: 0; transform: translateY(14px) scale(0.98); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      .animate-card-in { animation: cardIn 0.32s cubic-bezier(0.4, 0, 0.2, 1); }

      @keyframes starPop {
        0%   { transform: scale(1); }
        40%  { transform: scale(1.35); }
        100% { transform: scale(1); }
      }
      .animate-star-pop { animation: starPop 0.35s cubic-bezier(0.4, 0, 0.2, 1); }

      #new-deck-modal > div, #deck-menu > div, #rename-modal > div, #import-modal > div {
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s;
        transform: translateY(16px);
        opacity: 0;
      }
      #new-deck-modal.modal-open > div, #deck-menu.modal-open > div,
      #rename-modal.modal-open > div, #import-modal.modal-open > div {
        transform: translateY(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body class="text-ink font-sans min-h-screen select-none">

  <!-- Auth Screen -->
  <div id="auth-screen" class="hidden fixed inset-0 bg-paper flex items-center justify-center z-50 p-4">
    <div class="bg-surface rounded-2xl p-8 w-full max-w-sm shadow-lg shadow-ink/10">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-paper rounded-2xl flex items-center justify-center mx-auto mb-4">
          <svg width="46" height="46" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="12" width="56" height="76" rx="10" style="fill:rgb(var(--color-line))"/>
            <rect x="26" y="18" width="56" height="76" rx="10" style="fill:rgb(var(--color-base))"/>
            <rect x="32" y="24" width="56" height="76" rx="10" style="fill:rgb(var(--color-accent))"/>
            <path d="M 70 24 L 88 24 L 88 42 Z" style="fill:rgb(var(--color-on-accent))" opacity="0.92"/>
            <text x="60" y="76" font-family="Lora, Georgia, serif" font-size="34" font-weight="700" text-anchor="middle" style="fill:rgb(var(--color-on-accent))">F</text>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-ink font-heading">Felix Cards</h1>
        <p class="text-muted mt-1 text-sm">Enter your PIN to continue</p>
      </div>
      <input
        id="pin-input"
        type="password"
        inputmode="numeric"
        placeholder="PIN"
        autocomplete="current-password"
        class="w-full bg-base border border-line rounded-xl px-4 h-12 text-ink text-center text-xl tracking-widest focus:outline-none focus:border-accent mb-4"
      />
      <button
        id="pin-submit"
        class="w-full h-12 bg-accent hover:bg-accent-dark active:bg-accent-dark rounded-xl font-semibold text-on-accent transition-colors"
      >Unlock</button>
      <p id="pin-error" class="text-rate-again text-center mt-3 text-sm hidden">Wrong PIN. Try again.</p>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="pb-20 min-h-screen safe-top"></div>

  <!-- Bottom Nav -->
  <nav id="bottom-nav" class="hidden fixed bottom-0 left-0 right-0 bg-surface border-t border-line/60 safe-bottom z-40">
    <div class="flex">
      <button onclick="navigate('#/')" class="flex-1 flex flex-col items-center py-2.5 gap-1 text-muted hover:text-ink transition-colors nav-item" data-route="">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        <span class="text-xs">Home</span>
      </button>
      <button onclick="navigate('#/study/all')" class="flex-1 flex flex-col items-center py-2.5 gap-1 text-muted hover:text-ink transition-colors nav-item" data-route="study">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
        </svg>
        <span class="text-xs">Study</span>
      </button>
      <button onclick="navigate('#/journal')" class="flex-1 flex flex-col items-center py-2.5 gap-1 text-muted hover:text-ink transition-colors nav-item" data-route="journal">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
        <span class="text-xs">Journal</span>
      </button>
      <button onclick="navigate('#/stats')" class="flex-1 flex flex-col items-center py-2.5 gap-1 text-muted hover:text-ink transition-colors nav-item" data-route="stats">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        <span class="text-xs">Stats</span>
      </button>
    </div>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
